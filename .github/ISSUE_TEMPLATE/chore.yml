name: "🧹 Chore"
description: 빌드, CI, 의존성, 개발·배포 설정을 정비합니다.
title: "[Chore] "
labels: [chore]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용과 이유
      description: 어떤 설정이나 도구를 왜 변경하는지 적어주세요.
      placeholder: 예) 팀원이 같은 조건으로 서버 테스트를 실행할 수 있도록 Gradle 테스트 설정을 정리합니다.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 환경에 미치는 영향
      description: 로컬·PT 환경에서 팀원이 바꿔야 할 설정이나 실행 방법이 있으면 적어주세요. 환경 변수는 이름만 적어주세요.
      placeholder: 예) 로컬 실행 시 추가로 지정할 환경 변수 이름과 설정 위치

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 변경 후 어느 환경에서 어떤 명령이나 절차로 동작을 확인할지 적어주세요.
      placeholder: 예) 새 체크아웃에서 `./gradlew test`를 실행하면 성공합니다.
    validations:
      required: true
