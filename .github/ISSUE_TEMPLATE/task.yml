name: "👻 Task"
description: 여러 하위 이슈를 픽업 흐름이나 공통 목표로 묶습니다.
title: "[Task] "
labels: [task]
body:
  - type: textarea
    id: description
    attributes:
      label: 목표와 범위
      description: 어떤 픽업 흐름이나 서버 변경을 함께 완료해야 하는지 적어주세요.
      placeholder: 예) 픽업 생성부터 초대 링크로 동승자가 참여하기까지의 서버 작업을 묶습니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 전체 완료 조건
      description: 하위 작업을 연결했을 때 확인할 결과를 적어주세요.
      placeholder: 예) 차량 앱이 받은 초대 링크로 동승자 웹에서 참여하고, 같은 픽업을 조회할 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 하위 이슈와 진행 순서
      description: 개별 작업은 해당 유형의 이슈로 만든 뒤 하위 이슈로 연결해주세요. 먼저 끝나야 하는 작업이 있으면 적어주세요.
      placeholder: |
        - [ ] #12 픽업과 초대 생성
        - [ ] #13 동승자 참여 코드 교환
        - [ ] #14 차량 앱과 동승자 웹에서 함께 확인
