name: "🧪 Test"
description: WAY 서버의 자동화 테스트를 추가하거나 기존 테스트를 보완합니다.
title: "[Test] "
body:
  - type: textarea
    id: target
    attributes:
      label: 테스트 대상과 이유
      description: 어떤 API, 업무 규칙 또는 테스트를 보완하는지와 그 이유를 적어주세요. 테스트 유형(단위·통합 등)을 정했다면 함께 적어주세요.
      placeholder: 예) 픽업 생성 API의 정상 응답과 필수 입력 누락 오류를 회귀 테스트로 확인합니다.
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: 시나리오와 기대 결과
      description: 각 시나리오의 사전 조건이나 입력과 테스트에서 확인할 결과를 함께 적어주세요.
      placeholder: |
        - 유효한 픽업 생성 요청 → 201 응답과 생성된 픽업의 경로가 담긴 Location 헤더를 반환한다.
        - 동승자 정보가 빠진 픽업 생성 요청 → 400 응답과 passenger 필드 오류를 반환한다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 실행 방법
      description: 어떤 테스트가 통과하면 완료인지 적어주세요. 실행 명령이나 MySQL 같은 환경 조건을 알고 있다면 함께 적어주세요.
      placeholder: 예) ./gradlew test --tests '*PickupControllerTests' 실행 시 추가한 케이스와 기존 픽업 생성 테스트가 모두 통과한다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 이슈와 명세
      description: 관련 버그·기능 이슈, API 명세 또는 기존 테스트 링크가 있으면 연결해주세요.
