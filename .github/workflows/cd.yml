name: cd.yml

on:
  workflow_run:
    workflows: [ci.yml]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-image:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04-arm
    env:
      CI_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the commit tested by CI
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CI_SHA }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the executable JAR
        run: ./gradlew bootJar

      - name: Build and verify the ECS image
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          image="way-server:$CI_SHA"
          docker build --platform linux/arm64 -t "$image" .
          platform="$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')"
          test "$platform" = linux/arm64
          printf 'Built %s (%s)\n' "$image" "$platform"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
          allowed-account-ids: '762332938182'

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Push ARM64 image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          tag="$CI_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_image="$ECR_REGISTRY/way:$tag"
          docker image tag "way-server:$CI_SHA" "$remote_image"
          docker image push --platform linux/arm64 "$remote_image"
          printf 'Pushed %s\n' "$remote_image"
